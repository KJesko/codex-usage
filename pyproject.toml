[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-usage-dashboard"
dynamic = ["version"]
description = "Local web dashboard for Claude Code / Codex token usage: cost, cache hit-rate, live 5-hour block, and per-project/session breakdown. Built on top of ccusage."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "physcom", email = "elaman.job@gmail.com" }]
keywords = [
    "claude", "claude-code", "ccusage", "tokens", "cost",
    "dashboard", "llm", "observability", "usage", "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
# Runtime has NO Python dependencies (stdlib only). It does require the external
# `ccusage` CLI (npm) available on PATH — documented in the README.
dependencies = []

[project.urls]
Homepage = "https://github.com/physcom/claude-usage-dashboard"
Repository = "https://github.com/physcom/claude-usage-dashboard"
Issues = "https://github.com/physcom/claude-usage-dashboard/issues"

[project.scripts]
claude-usage = "claude_usage_dashboard.app:main"
claude-usage-dashboard = "claude_usage_dashboard.app:main"

[tool.hatch.version]
path = "src/claude_usage_dashboard/app.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage_dashboard"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]
