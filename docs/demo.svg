<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-label="Claude Code Usage Dashboard animated preview">
  <defs>
    <linearGradient id="liveStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#234"/>
      <stop offset="1" stop-color="#3b5aa6"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2b5fa0"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      text{fill:#e6edf3}
      .muted{fill:#8b949e}
      .k{fill:#8b949e;font-size:11px;letter-spacing:.5px}
      .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .pfill{transform-box:fill-box;transform-origin:0% 50%;animation:fill 7s cubic-bezier(.3,.7,.3,1) infinite}
      @keyframes fill{0%{transform:scaleX(0)}55%{transform:scaleX(.56)}92%{transform:scaleX(.56)}100%{transform:scaleX(0)}}
      .dot{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
      @keyframes pulse{0%{opacity:1;transform:scale(1)}70%{opacity:.3;transform:scale(1.7)}100%{opacity:1;transform:scale(1)}}
      .line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.2s ease-out .3s forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .fade{opacity:0;animation:fade .8s ease-out both}
      @keyframes fade{to{opacity:1}}
      .fade1{animation-delay:.1s}.fade2{animation-delay:.25s}.fade3{animation-delay:.4s}.fade4{animation-delay:.55s}
    </style>
  </defs>

  <!-- frame -->
  <rect x="2" y="2" width="956" height="536" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- header -->
  <text x="28" y="38" font-size="20" font-weight="700">Claude Code Usage
    <tspan class="muted" font-size="13" font-weight="400">  ·  2026-04-24 → 2026-07-02</tspan>
  </text>
  <rect x="720" y="20" width="96" height="26" rx="6" fill="#1c2230" stroke="#30363d"/>
  <text x="734" y="37" font-size="12" class="muted">All time ▾</text>
  <rect x="824" y="20" width="112" height="26" rx="6" fill="#1c2230" stroke="#30363d"/>
  <circle class="dot" cx="840" cy="33" r="4" fill="#3fb950"/>
  <text x="852" y="37" font-size="12" class="muted">↻ live</text>

  <!-- live 5h block -->
  <rect x="24" y="60" width="912" height="118" rx="10" fill="#12203a" stroke="url(#liveStroke)"/>
  <circle class="dot" cx="44" cy="84" r="5" fill="#3fb950"/>
  <text x="58" y="88" font-size="13" font-weight="600">Live 5-hour block</text>
  <text x="640" y="88" font-size="12" class="muted">02:00 – 07:00   ·   233 entries</text>

  <text x="44" y="126" font-size="26" font-weight="700">$85.44
    <tspan class="muted" font-size="14" font-weight="500"> → $106.95 projected</tspan>
  </text>
  <text x="470" y="120" class="k">BURN RATE</text>
  <text x="470" y="140" font-size="15" font-weight="600">$26.75/hr · 518K tok/min</text>
  <text x="740" y="120" class="k">CACHE HIT-RATE</text>
  <text x="740" y="140" font-size="15" font-weight="600" fill="#3fb950">97%</text>

  <!-- progress bar -->
  <rect x="44" y="150" width="848" height="10" rx="5" fill="#0d1117" stroke="#30363d"/>
  <rect class="pfill" x="45" y="151" width="846" height="8" rx="4" fill="url(#fillGrad)"/>

  <!-- summary cards -->
  <g class="fade fade1"><rect x="24" y="196" width="220" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="222" class="k">TOTAL COST</text><text x="40" y="250" font-size="22" font-weight="700">$2,383.92</text></g>
  <g class="fade fade2"><rect x="254" y="196" width="220" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="270" y="222" class="k">TOTAL TOKENS</text><text x="270" y="250" font-size="22" font-weight="700">2.97B</text></g>
  <g class="fade fade3"><rect x="484" y="196" width="220" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="500" y="222" class="k">CACHE HIT-RATE</text><text x="500" y="250" font-size="22" font-weight="700" fill="#3fb950">97.4%</text></g>
  <g class="fade fade4"><rect x="714" y="196" width="222" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="730" y="222" class="k">SESSIONS</text><text x="730" y="250" font-size="22" font-weight="700">46</text></g>

  <!-- tokens-per-day panel -->
  <rect x="24" y="286" width="560" height="228" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="42" y="312" font-size="13" font-weight="600">Tokens per day</text>
  <g>
    <!-- baseline 488 -->
    <g class="bar" style="animation-delay:.30s"><rect x="56"  y="428" width="34" height="60"  rx="3" fill="#3fb950"/><rect x="56"  y="410" width="34" height="18" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.36s"><rect x="104" y="398" width="34" height="90"  rx="3" fill="#3fb950"/><rect x="104" y="376" width="34" height="22" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.42s"><rect x="152" y="368" width="34" height="120" rx="3" fill="#3fb950"/><rect x="152" y="344" width="34" height="24" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.48s"><rect x="200" y="408" width="34" height="80"  rx="3" fill="#3fb950"/><rect x="200" y="388" width="34" height="20" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.54s"><rect x="248" y="348" width="34" height="140" rx="3" fill="#3fb950"/><rect x="248" y="320" width="34" height="28" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.60s"><rect x="296" y="378" width="34" height="110" rx="3" fill="#3fb950"/><rect x="296" y="356" width="34" height="22" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.66s"><rect x="344" y="338" width="34" height="150" rx="3" fill="#3fb950"/><rect x="344" y="312" width="34" height="26" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.72s"><rect x="392" y="393" width="34" height="95"  rx="3" fill="#3fb950"/><rect x="392" y="372" width="34" height="21" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.78s"><rect x="440" y="358" width="34" height="130" rx="3" fill="#3fb950"/><rect x="440" y="333" width="34" height="25" rx="3" fill="url(#barGrad)"/></g>
    <g class="bar" style="animation-delay:.84s"><rect x="488" y="383" width="34" height="105" rx="3" fill="#3fb950"/><rect x="488" y="361" width="34" height="22" rx="3" fill="url(#barGrad)"/></g>
  </g>
  <line x1="52" y1="488" x2="560" y2="488" stroke="#30363d"/>

  <!-- cost-per-day panel -->
  <rect x="600" y="286" width="336" height="228" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="618" y="312" font-size="13" font-weight="600">Cost per day</text>
  <path class="fade fade4" d="M620 470 L648 452 L676 458 L704 420 L732 432 L760 388 L788 400 L816 356 L844 372 L872 330 L900 344 L900 488 L620 488 Z" fill="url(#areaGrad)"/>
  <path class="line" d="M620 470 L648 452 L676 458 L704 420 L732 432 L760 388 L788 400 L816 356 L844 372 L872 330 L900 344"
        fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
