name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall src
      - name: Smoke test (--version / --help)
        run: |
          python src/claude_usage_dashboard/app.py --version
          python src/claude_usage_dashboard/app.py --help
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the CLI wrapper
        run: node --check bin/cli.js
