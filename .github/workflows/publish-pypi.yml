name: Publish to PyPI

# Fires when you publish a GitHub Release (e.g. tag v0.1.0).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Preferred: PyPI Trusted Publishing — no secret needed once configured at
        # https://pypi.org/manage/project/claude-usage-dashboard/settings/publishing/
        # Token fallback: uncomment and set the PYPI_API_TOKEN repo secret instead.
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
