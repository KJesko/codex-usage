<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>Codex Usage · 用量看板</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script src="/model-charts.js" defer></script><script src="/activity-heatmap.js" defer></script><script src="/project-treemap.js" defer></script><script src="/quota-dom.js" defer></script><script src="/quota-range.js" defer></script><script src="/usage-insights.js" defer></script><script src="/quota-tools.js" defer></script><script src="/quota-page.js" defer></script><script src="/compact-tables.js" defer></script><script src="/app.js" defer></script>
  <script src="/hint-help.js" defer></script>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<aside class="sidebar">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">&gt;_</span><span>Codex Usage</span></a>
  <div class="nav-label">用量</div>
  <nav aria-label="主要导航">
    <button class="nav active" data-view="overview"><span data-icon="overview"></span>用量总览</button>
    <div class="nav-subroutes" role="group" aria-label="用量总览子页面"><button data-overview-tab="summary">概览</button><button data-overview-tab="analysis">详细分析</button></div>
    <button class="nav" data-view="projects"><span data-icon="folder"></span>项目分析</button>
    <button class="nav" data-view="sessions"><span data-icon="chat"></span>会话明细</button>
    <button class="nav" data-view="models"><span data-icon="model"></span>模型分析</button>
    <button class="nav" data-view="quota"><span data-icon="refresh"></span>额度与重置</button>
    <div class="nav-label">管理</div>
    <button class="nav" data-view="pricing"><span data-icon="dollar"></span>价格与计费</button>
    <button class="nav" data-view="settings"><span data-icon="settings"></span>数据与设置</button>
  </nav>
  <div class="sidebar-bottom">
    <div class="profile-area">
      <button id="profileButton" class="sidebar-account" popovertarget="accountQuota" aria-label="查看账号额度" aria-controls="accountQuota" aria-expanded="false"><span id="accountAvatar" class="account-avatar" aria-hidden="true">CU</span><span class="profile-copy"><strong id="sidebarAccount">Codex 账号</strong><span id="sidebarPlan">正在连接</span></span><svg class="profile-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m5 6 3-3 3 3m-6 4 3 3 3-3"/></svg></button>
      <div id="accountStatus" class="profile-status"><span class="account-state"><i></i>正在连接</span></div>
    </div>
    <section id="accountQuota" class="account-quota" popover="auto" aria-labelledby="accountQuotaTitle"><div class="account-heading"><h2 id="accountQuotaTitle">账号额度</h2><span class="subtle">正在连接…</span></div></section>
    <button class="theme-button" id="theme"><span data-icon="sun"></span><span>切换深浅主题</span></button>
    <div class="version">Codex Usage <span>网页预览</span></div>
  </div>
</aside>
<div class="workspace">
  <header class="topbar"><div class="breadcrumbs"><span class="crumb">Codex Usage</span><span class="slash">/</span><span id="breadcrumb">用量总览 / 概览</span></div><div class="top-actions"><button id="filterButton" class="filter-trigger" popovertarget="filterPopover" aria-controls="filterPopover" aria-expanded="false" aria-label="展开筛选设置"><span data-icon="filter"></span><span id="filterSummary">正在读取筛选条件</span><span class="filter-chevron" aria-hidden="true">⌄</span></button><button class="button small" id="alertsButton" popovertarget="alertsPopover" aria-controls="alertsPopover" aria-expanded="false">提醒</button><button class="icon-button" id="refresh" aria-label="刷新数据" title="刷新用量和账号额度"><span data-icon="refresh"></span></button></div></header>
  <section id="filterPopover" class="filter-popover" popover="auto" aria-labelledby="filterTitle">
    <div class="filter-heading"><h2 id="filterTitle">筛选设置</h2><button class="icon-button" popovertarget="filterPopover" popovertargetaction="hide" aria-label="关闭筛选设置">×</button></div>
    <form id="filters">
      <div class="filter-field-title">时间范围</div>
      <div class="periods" role="group" aria-label="日期范围"><button type="button" data-range="today">今天</button><button type="button" data-range="week">本周</button><button type="button" data-range="7">近 7 天</button><button type="button" data-range="30" class="selected">近 30 天</button><button type="button" data-range="all">全部</button><button type="button" data-range="custom">自定义</button></div>
      <div id="customRange" hidden><label>开始日期<input id="since" type="date"></label><label>结束日期<input id="until" type="date"></label></div>
      <div class="select-filters"><label id="sourceWrap"><span>机器</span><select id="source" aria-label="筛选机器"><option value="">全部机器</option></select></label><label><span>项目</span><select id="project" aria-label="筛选项目"><option value="">全部项目</option></select></label><label><span>模型</span><select id="model" aria-label="筛选模型"><option value="">全部模型</option></select></label><label id="accountWrap"><span>账号分组</span><select id="account" aria-label="筛选账号分组"><option value="">全部账号分组</option></select></label></div>
      <div id="remoteSummary" class="remote-summary" aria-live="polite" hidden></div>
      <div id="usageBoundary" class="notice" hidden></div>
      <p id="filterError" class="filter-error" role="alert" hidden></p>
      <div class="filter-actions"><button type="button" class="text-button" id="clearFilters">清除维度筛选</button><button class="button primary" type="submit">应用筛选</button></div>
    </form>
  </section>
  <section id="alertsPopover" class="alerts-popover" popover="auto" aria-label="额度提醒列表"></section>
  <main id="main">
    <div class="page-heading"><div><h1 id="pageTitle">用量总览</h1><p id="pageSubtitle">Token 用量、API 等价成本和账号额度。</p></div><button class="button" id="export"><span data-icon="download"></span>导出 CSV</button></div>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="quotaAlertBanner"></div>
    <div id="loading" class="loading" role="status"><span class="spinner"></span>正在整理本地用量记录…</div>
    <div id="content" hidden></div>
    <footer><span id="updated">等待首次读取</span><span data-help="后台采集">后台日志采集 30 秒 · 账号额度采集 60 秒</span></footer>
  </main>
</div>
<dialog id="sessionDialog" aria-labelledby="sessionTitle"><div class="dialog-top"><span class="subtle">会话详情</span><button class="icon-button" id="closeDialog" aria-label="关闭会话详情">×</button></div><div id="sessionDetail"></div></dialog>
<dialog id="projectDialog" aria-labelledby="projectTitle"><div class="dialog-top"><span class="subtle">项目详情</span><button class="icon-button" id="closeProjectDialog" aria-label="关闭项目详情">×</button></div><div id="projectDetail"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
